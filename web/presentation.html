<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Are You Smarter Than A Fruit Fly?</title>
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fruitfly.review/presentation" />
    <meta property="og:title" content="Are You Smarter Than A Fruit Fly?" />
    <meta property="og:description" content="A talk by Nick Nisi: 176,422 real fruit-fly neurons review code, and executed tests teach them." />
    <meta property="og:image" content="https://fruitfly.review/assets/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="/presentation.css" />
  </head>
  <body class="bare">
    <canvas
      id="brain"
      class="brain"
      aria-label="The fly's brain: 176,422 simulated neurons at their real positions"
    ></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <canvas id="rain" class="rain gone" aria-hidden="true"></canvas>
    <main id="deck" class="deck" aria-live="polite"></main>
    <div id="fly" class="fly" aria-label="The fly. Click a body part to touch it; move fast at it to startle it."></div>
    <p id="touch" class="touch" role="status"></p>
    <div id="saber-stage" class="saber-stage" aria-hidden="true"></div>
    <svg id="jack" class="jack" aria-hidden="true">
      <path class="cable" />
      <path class="cable-shine" />
      <circle class="plug" r="9" />
    </svg>
    <div id="flash" class="flash" aria-hidden="true"></div>
    <div id="readout" class="readout" aria-hidden="true">
      <span class="dot kenyon"></span><b id="readout-kenyon">—</b> memory cells lit <span class="dot avoid"></span
      ><b id="readout-avoid">—</b> avoid <span class="dot approach"></span><b id="readout-approach">—</b> approach
      <span class="dot dan"></span><b id="readout-dan">—</b> dopamine <span class="dot feed"></span
      ><b id="readout-feed">—</b> tongue
    </div>
    <div class="progress" aria-hidden="true"><i id="progress"></i></div>
    <aside id="notes" class="notes" hidden>
      <header><b id="notes-title"></b><span id="notes-clock"></span></header>
      <div id="notes-body"></div>
      <footer>← → move · N notes · F fullscreen · B brain only · Home restart</footer>
    </aside>
    <script type="module" src="/presentation.js"></script>
  </body>
</html>
